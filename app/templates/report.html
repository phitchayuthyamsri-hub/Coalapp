<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily/Weekly performance report</title>
<style>
  :root{ --bg:#0b0b0c; --panel:#161618; --panel2:#1d1d20; --line:#2a2a2e; --ink:#e6e6ea; --mut:#8a8f98; --acc:#9cd0ff; --good:#54c98a; --warn:#e6b450; --bad:#e07a6b; --day:#5b9bd5; --night:#2f4b6e; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  header .brand{font-weight:700}
  header .sp{flex:1}
  header a{color:var(--acc);text-decoration:none;font-size:13px;margin-left:14px}
  header a:hover{text-decoration:underline}
  header .who{color:var(--mut);font-size:13px}
  .wrap{padding:18px 20px;max-width:none;margin:0}   /* full window width - nothing held in a middle column (user 11/11/2026) */
  .tabs{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
  .tab{padding:8px 16px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;font-size:13px}
  .tab.on{background:#26405e;border-color:#3a5f87;color:#fff}
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}
  .bar label{color:var(--mut);font-size:12px}
  select,input[type=date]{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:var(--panel);color:var(--ink);border:0;padding:6px 14px;cursor:pointer;font-size:13px;border-left:1px solid var(--line)}
  .seg button:first-child{border-left:0}
  .seg button.on{background:#26405e;color:#fff}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px}
  .card h2{margin:0 0 12px;font-size:15px}
  .card .sub{color:var(--mut);font-size:12px;font-weight:400}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th:first-child,td:first-child,.l{text-align:left}
  thead th{color:var(--mut);font-weight:600;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;background:var(--panel)}
  tbody tr:hover{background:#1b1b1f}
  .tableScroll{overflow:auto;max-height:62vh}
  .pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;border:1px solid var(--line)}
  .pill.Ongoing{color:var(--good);border-color:#2f6b4d}
  .pill.Stop{color:var(--warn);border-color:#6b5a2f}
  .pill.Complete{color:var(--acc);border-color:#2f4f6b}
  .pill.Cancelled{color:var(--mut)}
  .neg{color:var(--bad)} .pos{color:var(--good)}
  .muted{color:var(--mut)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  .upbox{border:1px dashed var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  .upbox h3{margin:0 0 4px;font-size:14px}
  .upbox p{margin:0 0 10px;color:var(--mut);font-size:12px}
  button.act{background:#26405e;color:#fff;border:1px solid #3a5f87;border-radius:7px;padding:7px 14px;cursor:pointer;font-size:13px}
  button.act:hover{background:#2f4f73}
  .status{font-size:12px;color:var(--mut);margin-left:8px}
  body.noedit .editonly{display:none!important}
  .kv{display:flex;gap:18px;flex-wrap:wrap;color:var(--mut);font-size:12px}
  .kv b{color:var(--ink);font-weight:600}
  .legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .empty{color:var(--mut);padding:24px;text-align:center}
  /* Daily tab = the team's daily e-mail (11/11/2026): white sheet, Excel pivot (medium blue) tables */
  .mail{background:#fff;color:#000;border-radius:6px;padding:18px 22px 24px;font-family:Calibri,'Segoe UI',Arial,sans-serif;overflow-x:auto}
  .mail .mh{font-weight:700;font-size:14px;margin:4px 0 10px}
  .xt{border-collapse:collapse;font-size:12.5px;width:auto;margin-left:6px}
  .xt th{background:#305496;color:#fff;font-weight:700;text-align:left;padding:2px 8px;border-bottom:1px solid #8EA9DB;white-space:nowrap;position:static}
  .xt th.n,.xt td.n{text-align:right}
  .xt td{padding:2px 8px;border-bottom:1px solid #D9E1F2;white-space:nowrap;color:#000;text-align:left}
  .xt td.cu{background:#8EA9DB;color:#fff;border-bottom-color:#8EA9DB}
  .xt td.rl{background:#D9E1F2}
  .xt td.ct{border:1px solid #8EA9DB}
  .xt td.dc,.xt th.dc{background:#D9D9D9;color:#000}
  .xt th.dc{background:#BFBFBF}
  .xt td.bad{color:#C00000;font-weight:700}
  .xt td.rm{color:#C00000;font-size:11.5px}
  .xt tr.gt td{font-weight:700;border-top:1px solid #4472C4;border-bottom:none;background:#fff}
  .xt tbody tr:hover{background:transparent}
  .mchart{margin:14px 0 18px}
  .mchart.tr{border:1px solid #D9D9D9}
  .mchart.tr svg+svg{border-top:1px solid #D9D9D9}
  .xsvg{width:100%;height:auto;display:block;font-family:Calibri,'Segoe UI',Arial,sans-serif;background:#fff}
  .trleg{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;font-size:14px;color:#595959;padding:6px 0;border-top:1px solid #D9D9D9;font-family:Calibri,'Segoe UI',Arial,sans-serif}
  .trleg span{display:inline-flex;align-items:center;gap:6px}
  .trleg i{display:inline-block;width:26px;height:11px}
</style>
<script src="/static/datefmt.js?v={{ asset_v('datefmt.js') }}"></script>
</head>
<body>
<header>
  <span class="brand">Daily / Weekly performance report</span>
  <span class="sp"></span>
  <span class="who">{{ username }}</span>
  <a href="/">&larr; Home</a>
  {% if is_admin %}<a href="/admin">Admin</a>{% endif %}
  <a href="/logout">Log out</a>
</header>
<div class="wrap">
  <div class="tabs">
    <button class="tab on" data-tab="daily">Daily</button>
    <button class="tab" data-tab="weekly">Weekly</button>
    <button class="tab" data-tab="accuracy">Accuracy</button>
    <button class="tab" data-tab="data">Data</button>
  </div>
  <div class="bar" id="marketBar">
    <label>Market</label>
    <div class="seg" id="mkt">
      <button data-m="" class="on">All</button>
      <button data-m="Oversea">Oversea</button>
      <button data-m="Domestic">Domestic</button>
    </div>
    <span class="status" id="asof"></span>
  </div>
  <div id="view"></div>
</div>
<script>
const $=s=>document.querySelector(s);
let ME={can_edit:false}, RAW={weighbridge:[],contracts:[],readiness:[]};
let CMAP={}, WROWS=[], REGrows=[], TAB='daily', MARKET='', WK_SUB='vol';
const WORKDAYS=7, WEEKS=12, TGT={Oversea:60,Domestic:32};
const BK_LABELS=['32–34','35–37','38–40','40–50','51–60','61–65','66+'];

const normC=s=>String(s||'').trim().toUpperCase();
const normP=s=>String(s||'').trim().toUpperCase().replace(/[\s.\-_/\\]/g,'');
// the team's Volume range (Calculation file col AO): net <= 34 t, 37, 40, 50, 60, 65, above
function bkIdx(n){n=+n||0; if(n<=34)return 0; if(n<=37)return 1; if(n<=40)return 2; if(n<=50)return 3; if(n<=60)return 4; if(n<=65)return 5; return 6;}
const fmt=(n,d=0)=>(+n||0).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
function dmy(s){ if(!s)return''; const p=String(s).split('-'); return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s; }
function mondayOf(s){ const d=new Date(s+'T00:00:00'); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return iso(d); }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(s,n){ const d=new Date(s+'T00:00:00'); d.setDate(d.getDate()+n); return iso(d); }
function wkLabel(s){ const d=new Date(s+'T00:00:00'); return d.getDate()+' '+d.toLocaleString('en',{month:'short'}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

async function boot(){
  try{ ME=await (await fetch('/api/me')).json(); }catch(e){}
  if(!ME.can_edit) document.body.classList.add('noedit');
  $('#marketBar').style.display='none';   // opens on Daily (the e-mail has no market filter)
  await reload();
  $('#mkt').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; MARKET=b.dataset.m; $$('#mkt button').forEach(x=>x.classList.toggle('on',x===b)); render(); });
  document.querySelector('.tabs').addEventListener('click',e=>{ const b=e.target.closest('.tab'); if(!b)return; TAB=b.dataset.tab; $$('.tab').forEach(x=>x.classList.toggle('on',x===b)); $('#marketBar').style.display=(TAB==='data'||TAB==='daily')?'none':''; render(); });
}
function $$(s){return [...document.querySelectorAll(s)];}

// the server sends the report rows compact (11/11/2026): dictionaries + arrays
function decode(j){
  const D=(j&&j.dict)||{c:[],p:[],cust:[],co:[],sub:[]}, M=['','Oversea','Domestic'];
  return { contracts:(j&&j.contracts)||[], totals:(j&&j.totals)||{}, summary:(j&&j.summary)||{}, meta:(j&&j.meta)||{}, since:(j&&j.since)||'',
    weighbridge:((j&&j.w)||[]).map(r=>({d:r[0],p:D.p[r[1]],net:r[2],c:D.c[r[3]],cust:D.cust[r[4]],m:M[r[5]]||'',ap:r[6]?'n':'d',di:r[7]||r[0]})),
    readiness:((j&&j.r)||[]).map(r=>({regDate:r[0],plate:D.p[r[1]],contract:D.c[r[2]],company:D.co[r[3]],sub:D.sub[r[4]]})) };
}
async function reload(){
  try{ RAW=decode(await (await fetch('/api/coalrpt/data')).json()); }catch(e){ RAW=decode(null); }
  build(); render();
}
function build(){
  CMAP={}; (RAW.contracts||[]).forEach(c=>{ CMAP[normC(c.contract)]=c; });
  WROWS=(RAW.weighbridge||[]).filter(r=>r&&r.d).map(r=>{ const ck=normC(r.c); const c=CMAP[ck];
    return {ck, date:r.d, dayIn:r.di||r.d, net:+r.net||0, ap:(r.ap==='n'?'n':'d'), p:normP(r.p),
            market:(c&&c.export)||r.m||'', cust:(c&&c.customer)||r.cust||r.c||'(no contract)'}; });
  REGrows=(RAW.readiness||[]).map(r=>({ck:normC(r.contract), plate:normP(r.plate), regDate:r.regDate||'',
            company:r.company||'', sub:r.sub||'', market:(CMAP[normC(r.contract)]&&CMAP[normC(r.contract)].export)||''}));
  const asof=maxW(); $('#asof').textContent = asof ? ('Latest delivery: '+dmy(asof)+(RAW.since?' · rows since '+dmy(RAW.since):'')) : 'No loading data yet — upload it on the Data tab (1. Input_Actual data loading).';
}
const mOK=r=>!MARKET||r.market===MARKET;
function maxW(){ let m=''; WROWS.forEach(r=>{ if(r.date>m)m=r.date; }); return m; }
function maxReg(){ let m=''; REGrows.forEach(r=>{ if(r.regDate>m)m=r.regDate; }); return m; }

function aggregate(){
  const cd={},bk={},dn={},wk={};
  WROWS.forEach(r=>{ if(!mOK(r))return;
    (cd[r.ck]=cd[r.ck]||{}); (cd[r.ck][r.date]=cd[r.ck][r.date]||{t:0,n:0}); cd[r.ck][r.date].t+=r.net; cd[r.ck][r.date].n++;
    (bk[r.ck]=bk[r.ck]||{}); (bk[r.ck][r.date]=bk[r.ck][r.date]||[0,0,0,0,0,0,0]); bk[r.ck][r.date][bkIdx(r.net)]++;
    (dn[r.date]=dn[r.date]||{d:0,n:0}); dn[r.date][r.ap]++;
    const w=mondayOf(r.date); (wk[w]=wk[w]||{t:0,n:0}); wk[w].t+=r.net; wk[w].n++;
  });
  return {cd,bk,dn,wk};
}
function regCount(date){ const seen={},m={}; REGrows.forEach(r=>{ if(MARKET&&r.market&&r.market!==MARKET)return; if(date&&r.regDate!==date)return; if(!r.plate)return; const k=r.ck+'|'+r.plate; if(seen[k])return; seen[k]=1; m[r.ck]=(m[r.ck]||0)+1; }); return m; }
function tonPerTrip(c){ return (c&&+c.tonPerTrip>0)?+c.tonPerTrip:(TGT[(c&&c.export)||'']||TGT.Oversea); }
function remainingWeeks(c,asof){ const e=c.extension||c.end; if(!e)return 1; const days=(new Date(e+'T00:00:00')-new Date(asof+'T00:00:00'))/864e5; return Math.max(1,Math.ceil(days/7)); }

function render(){
  if(TAB==='daily') return renderDaily();
  if(TAB==='weekly') return renderWeekly();
  if(TAB==='accuracy') return renderAccuracy();
  return renderData();
}

/* ---------- DAILY ---------- */
// The team's daily e-mail, as the page (11/11/2026): "Daily report Coal actual movement &
// NT truck readiness comparison report as of <day>". Contract status + Truck plan tables
// (Excel pivot look), Day/Night trips of the last 7 days, and the Truck register charts
// Weekly / Daily / By customer / By Subcontractor. The day is a loading day, 06:00-06:00.
let DREP=null, DDAY='';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dmy2=s=>{ if(!s)return''; const p=s.split('-'); return (+p[2])+'/'+p[1]+'/'+p[0].slice(2); };      // 9/06/26
const dmy4=s=>{ if(!s)return''; const p=s.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; };                 // 04/11/2026
const dLab=s=>{ const p=s.split('-'); return p[2]+'-'+MON[+p[1]-1]+'-'+p[0].slice(2); };                // 10-Nov-26
// Excel accounting: 0 = "-", negatives in brackets
const acc=(v,d=0)=>{ v=+v||0; const r=Math.round(v*Math.pow(10,d))/Math.pow(10,d); if(!r) return '-'; const s=Math.abs(r).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}); return r<0?'('+s+')':s; };
async function renderDaily(){
  if(!DREP||DREP.day!==DDAY){ $('#view').innerHTML='<div class="empty">Building the report…</div>';
    try{ DREP=await (await fetch('/api/coalrpt/daily'+(DDAY?'?day='+DDAY:''))).json(); DDAY=DREP.day; }
    catch(e){ $('#view').innerHTML='<div class="empty">Could not build the report: '+esc(e)+'</div>'; return; } }
  if(TAB!=='daily') return;
  const R=DREP;
  let h='<div class="bar"><label>Report day</label><button class="act" data-dd="-1">‹</button><input type="date" id="ddPick" value="'+R.day+'"><button class="act" data-dd="1">›</button>'+
    '<span class="status">loading day '+dmy4(R.day)+' 06:00 → '+dmy4(addDays(R.day,1))+' 06:00</span></div>';
  h+='<div class="mail"><p class="mh">Daily report Coal actual movement ;</p>'+statusTable(R)+'<br>'+planTable(R)+
     '<div class="mchart">'+dnChart(R.dayNight)+'</div>'+
     '<p class="mh">PSVN truck readiness comparison report ;</p>'+
     '<div class="mchart tr">'+trChart(R.weekly.map(w=>({lab:w.label,reg:w.reg,act:w.act,nreg:w.nreg})),{title:'Weekly',h:330})+trLegend()+
       trChart(R.daily.map(d=>({lab:d.date.slice(8),grp:MON[+d.date.slice(5,7)-1],reg:d.reg,act:d.act,nreg:d.nreg})),{title:'Daily',h:380})+
       trChart(R.byCustomer.map(d=>({lab:d.customer,reg:d.reg,act:d.act,nreg:d.nreg})),{title:'By customer',h:380,area:'tri'})+
       trChart(R.bySub.map(d=>({lab:d.company,grp:d.customer,reg:d.reg,act:d.act,nreg:d.nreg})),{title:'By Subcontractor',h:420,wrap:true})+'</div>'+
     '</div>';
  $('#view').innerHTML=h;
  const pk=$('#ddPick'); if(pk) pk.addEventListener('change',()=>{ if(pk.value){ DDAY=pk.value; renderDaily(); } });
  $$('#view [data-dd]').forEach(b=>b.addEventListener('click',()=>{ DDAY=addDays(R.day,+b.dataset.dd); renderDaily(); }));
}
function statusTable(R){
  const H=['Customer','Export/Oversea','Term','End user','Contract','Start','End','GAR','Total Quantity',dLab(R.day),'Contract to date','Balance remaining'];
  let h='<table class="xt"><thead><tr>'+H.map((x,i)=>'<th class="'+(i>=8?'n':'')+'">'+x+'</th>').join('')+'</tr></thead><tbody>';
  let prev='', T={q:0,d:0,t:0};
  R.status.forEach(r=>{ const first=r.customer!==prev; prev=r.customer; T.q+=+r.qty||0; T.d+=+r.day||0; T.t+=+r.toDate||0;
    h+='<tr><td class="cu">'+(first?esc(r.customer):'')+'</td><td class="rl">'+(first?esc(r.export):'')+'</td><td class="rl">'+(first?esc(r.term):'')+'</td><td class="rl">'+(first?esc(r.endUser):'')+'</td>'+
      '<td>'+esc(r.contract)+'</td><td class="rl">'+dmy2(r.start)+'</td><td class="rl'+(r.ended?' bad" title="Contract ended - still Ongoing in the contract list':'')+'">'+dmy2(r.end)+'</td><td>'+esc(r.gar)+'</td>'+
      '<td class="n">'+acc(r.qty)+'</td><td class="n">'+acc(r.day)+'</td><td class="n">'+acc(r.toDate)+'</td><td class="n">'+acc(Math.max(0,(+r.qty||0)-(+r.toDate||0)))+'</td></tr>'; });
  h+='<tr class="gt"><td>Grand Total</td><td colspan="7"></td><td class="n">'+acc(T.q)+'</td><td class="n">'+acc(T.d)+'</td><td class="n">'+acc(T.t)+'</td><td class="n">'+acc(Math.max(0,T.q-T.t))+'</td></tr>';
  return h+'</tbody></table>';
}
function planTable(R){
  const H=['Customer','Export/Oversea','Transporter','Contract','GAR','Quantity','Plan truck','Plan truck / day','Variance','Truck register','32-34t','35-37t','38-40t','40-50t','51-60t','61-65t','66t+',dLab(R.day),'Remark'];
  const tip={5:'Contract quantity - loaded to date',6:'Quantity / Ton per trip, rounded up',7:'Plan truck / days left in the contract, rounded up',8:'Trucks loaded on the day - Plan truck / day',9:'Truck readiness registrations for the day'};
  let h='<table class="xt"><thead><tr>'+H.map((x,i)=>'<th class="'+(i>=5&&i<18?'n':'')+(i===17?' dc':'')+'"'+(tip[i]?' title="'+tip[i]+'"':'')+'>'+x+'</th>').join('')+'</tr></thead><tbody>';
  let prev=''; const T={q:0,p:0,pd:0,reg:0,b:[0,0,0,0,0,0,0],tr:0};
  R.plan.forEach(r=>{ const first=r.customer!==prev; prev=r.customer;
    T.q+=r.quantity; T.p+=r.plan; T.pd+=r.perDay; T.reg+=r.register; T.tr+=r.trips; r.bands.forEach((v,i)=>T.b[i]+=v);
    h+='<tr><td class="cu">'+(first?esc(r.customer):'')+'</td><td class="rl">'+(first?esc(r.export):'')+'</td><td class="rl">'+(first?esc(r.transporter||'N/A'):'')+'</td>'+
      '<td class="rl ct">'+esc(r.contract)+'</td><td>'+esc(r.gar)+'</td>'+
      '<td class="n">'+acc(r.quantity)+'</td><td class="n">'+acc(r.plan)+'</td><td class="n" title="'+r.plan+' trucks over '+r.daysLeft+' day(s) to '+dmy2(r.refEnd)+' at '+r.tonPerTrip+' t/trip">'+acc(r.perDay)+'</td>'+
      '<td class="n">'+acc(r.variance)+'</td><td class="n">'+acc(r.register)+'</td>'+r.bands.map(v=>'<td class="n">'+acc(v)+'</td>').join('')+
      '<td class="n dc">'+acc(r.trips)+'</td><td class="rm">'+esc(r.remark)+'</td></tr>'; });
  h+='<tr class="gt"><td>Grand Total</td><td colspan="4"></td><td class="n">'+acc(T.q)+'</td><td class="n">'+acc(T.p)+'</td><td class="n">'+acc(T.pd)+'</td><td class="n">'+acc(T.tr-T.pd)+'</td><td class="n">'+acc(T.reg)+'</td>'+
    T.b.map(v=>'<td class="n">'+acc(v)+'</td>').join('')+'<td class="n dc">'+acc(T.tr)+'</td><td></td></tr>';
  return h+'</tbody></table>';
}
// Day / Night trips, last 7 days (the e-mail's first picture)
function dnChart(D){
  const W=1423,H=289,L=24,Rr=W-24,T=24,B=304-110,n=D.length||1,sw=(Rr-L)/n,max=Math.max(1,...D.map(d=>Math.max(d.day,d.night)))*1.25;
  let s='<svg viewBox="0 0 '+W+' '+H+'" class="xsvg"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#E7E6E6" stroke-width="1.4"/></pattern></defs>'+
    '<rect x="'+L+'" y="'+T+'" width="'+(Rr-L)+'" height="'+(B-T)+'" fill="url(#hatch)"/>';
  for(let g=0;g<=6;g++){ const y=T+(B-T)*g/6; s+='<line x1="'+L+'" y1="'+y+'" x2="'+Rr+'" y2="'+y+'" stroke="#D9D9D9"/>'; }
  for(let i=0;i<=n;i++){ const x=L+i*sw; s+='<line x1="'+x+'" y1="'+T+'" x2="'+x+'" y2="'+B+'" stroke="#D9D9D9"/>'; }

/* ---------- WEEKLY ---------- */
function renderWeekly(){
  const A=aggregate();
  const weeks=Object.keys(A.wk).sort().slice(-WEEKS);
  let html='<div class="bar"><div class="seg" id="wksub">'+
    [['vol','Volume (t)'],['trip','Trips'],['pva','Plan vs actual'],['grid','By contract']].map(([k,l])=>`<button data-k="${k}" class="${k===WK_SUB?'on':''}">${l}</button>`).join('')+
    '</div><span class="status">last '+WEEKS+' weeks</span></div>';

  if(!weeks.length){ $('#view').innerHTML=html+'<div class="card"><div class="empty">No delivery data for this market.</div></div>'; wireWkSub(); return; }

  if(WK_SUB==='vol'){
    html+='<div class="card"><h2>Volume by week (tons)</h2>'+barSVG(weeks.map(w=>({label:wkLabel(w),v:A.wk[w].t})),'var(--day)',v=>fmt(v))+'</div>';
  } else if(WK_SUB==='trip'){
    html+='<div class="card"><h2>Trips by week</h2>'+barSVG(weeks.map(w=>({label:wkLabel(w),v:A.wk[w].n})),'var(--good)',v=>fmt(v))+'</div>';
  } else if(WK_SUB==='pva'){
    // per-week plan = sum of active ongoing contracts' even weekly quota; compare to actual
    const planByWeek={}; (RAW.contracts||[]).filter(c=>(!MARKET||c.export===MARKET)&&c.start&&c.end).forEach(c=>{
      const wks=Math.max(1,Math.round((new Date(c.end+'T00:00:00')-new Date(c.start+'T00:00:00'))/864e5/7));
      const per=(+c.qty||0)/wks; let w=mondayOf(c.start); const endW=mondayOf(c.end);
      let guard=0; while(w<=endW && guard++<400){ planByWeek[w]=(planByWeek[w]||0)+per; w=addDays(w,7); }
    });
    let as=0,over=0,under=0;
    const rows=weeks.map(w=>{ const act=A.wk[w].t, pl=planByWeek[w]||0; const diff=act-pl; const cls=Math.abs(diff)<=pl*0.05?'as':(diff>0?'over':'under'); if(cls==='as')as++;else if(cls==='over')over++;else under++; return {w,act,pl,diff,cls}; });
    html+='<div class="card"><h2>Plan vs actual by week</h2><div class="kv" style="margin-bottom:12px"><span>As plan: <b>'+as+'</b></span><span>Over plan: <b class="pos">'+over+'</b></span><span>Under plan: <b class="neg">'+under+'</b></span></div>'+
      '<div class="tableScroll"><table><thead><tr><th class="l">Week</th><th>Plan (t)</th><th>Actual (t)</th><th>Diff</th><th class="l">Result</th></tr></thead><tbody>'+
      rows.map(r=>`<tr><td class="l">${wkLabel(r.w)}</td><td>${fmt(r.pl)}</td><td>${fmt(r.act)}</td><td class="${r.diff<0?'neg':'pos'}">${r.diff>0?'+':''}${fmt(r.diff)}</td><td class="l">${r.cls==='as'?'As plan':r.cls==='over'?'<span class=pos>Over</span>':'<span class=neg>Under</span>'}</td></tr>`).join('')+
      '</tbody></table></div></div>';
  } else {
    // by-contract grid: actual tons per week
    const cks=Object.keys(A.cd).sort((a,b)=>label(b).localeCompare(label(a)));
    html+='<div class="card"><h2>Actual tons by contract &times; week</h2><div class="tableScroll"><table><thead><tr><th class="l">Contract</th>'+weeks.map(w=>`<th>${wkLabel(w)}</th>`).join('')+'<th>Total</th></tr></thead><tbody>';
    cks.forEach(ck=>{ let tot=0; const cells=weeks.map(w=>{ let t=0; const cd=A.cd[ck]; if(cd)for(const d in cd){ if(mondayOf(d)===w)t+=cd[d].t; } tot+=t; return `<td>${t?fmt(t):''}</td>`; }); html+=`<tr><td class="l">${esc(label(ck))}</td>`+cells.join('')+`<td><b>${fmt(tot)}</b></td></tr>`; });
    html+='</tbody></table></div></div>';
  }
  $('#view').innerHTML=html; wireWkSub();
}
function label(ck){ const c=CMAP[ck]; if(c)return c.customer+' · '+c.contract; const r=WROWS.find(x=>x.ck===ck); return (r?r.cust:ck)+' ('+ck+')'; }
function wireWkSub(){ const e=$('#wksub'); if(e)e.addEventListener('click',ev=>{ const b=ev.target.closest('button'); if(!b)return; WK_SUB=b.dataset.k; $$('#wksub button').forEach(x=>x.classList.toggle('on',x===b)); renderWeekly(); }); }
function barSVG(items,color,fmtv){
  const W=900,H=260,padB=40,padT=16,padL=44; const n=items.length||1; const max=Math.max(1,...items.map(i=>i.v));
  const cw=(W-padL)/n, bw=Math.min(46,cw*0.6);
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%">`;
  for(let g=0;g<=4;g++){ const y=padT+(H-padB-padT)*g/4; const val=max*(1-g/4); s+=`<line x1="${padL}" y1="${y}" x2="${W}" y2="${y}" stroke="var(--line)"/><text x="${padL-6}" y="${y+3}" fill="var(--mut)" font-size="9" text-anchor="end">${fmtv(val)}</text>`; }
  items.forEach((it,i)=>{ const x=padL+i*cw+(cw-bw)/2; const h=(it.v/max)*(H-padB-padT); const y=H-padB-h;
    s+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${color}" rx="2"/>`;

    s+=`<text x="${x+bw/2}" y="${H-padB+14}" fill="var(--mut)" font-size="9" text-anchor="middle">${it.label}</text>`;
  });
  return s+'</svg>';
}

/* ---------- ACCURACY ---------- */
// The team's Truck register file (11/11/2026), formula for formula:
//   Index = Contract _ Truck No _ loading Date; a ticket is "Actual" when the Truck
//   readiness holds that index (second try: the gate-in date), else "Not in truck
//   registered". %Accuracy = Actual / Truck readiness (registrations).
let ACC_BY='sub';
function accGroups(){
  const reg={}; REGrows.forEach(r=>{ if(!r.plate||!r.regDate)return; if(MARKET&&r.market&&r.market!==MARKET)return;
    const k=r.ck+'|'+r.plate+'|'+r.regDate; if(!reg[k]) reg[k]={r,act:0}; });
  const cust=ck=>{ const c=CMAP[ck]; return c?c.customer:(ck||'(no contract)'); };
  const dim={ sub:x=>x.sub||'(none)', cust:x=>cust(x.ck), week:x=>mondayOf(x.day), day:x=>x.day }[ACC_BY];
  const G={}, g=k=>G[k]||(G[k]={reg:0,act:0,nreg:0});
  for(const k in reg){ const x=reg[k].r; g(dim({sub:x.sub,ck:x.ck,day:x.regDate})).reg++; }
  const since=RAW.since||'';
  WROWS.forEach(w=>{ if(!mOK(w)||!w.p||w.date<since)return;
    const hit=reg[w.ck+'|'+w.p+'|'+w.date]||reg[w.ck+'|'+w.p+'|'+w.dayIn];
    if(hit){ g(dim({sub:hit.r.sub,ck:w.ck,day:hit.r.regDate})).act++; }
    else g(dim({sub:'(not in truck registered)',ck:w.ck,day:w.date})).nreg++; });
  return G;
}
function renderAccuracy(){
  const G=accGroups();
  let rows=Object.keys(G).map(k=>Object.assign({g:k,acc:G[k].reg?G[k].act/G[k].reg*100:0},G[k]));
  if(ACC_BY==='week'||ACC_BY==='day') rows.sort((a,b)=>b.g.localeCompare(a.g)); else rows.sort((a,b)=>b.reg-a.reg||b.nreg-a.nreg);
  const T=rows.reduce((t,r)=>({reg:t.reg+r.reg,act:t.act+r.act,nreg:t.nreg+r.nreg}),{reg:0,act:0,nreg:0});
  let html='<div class="bar"><div class="seg" id="accby">'+
    [['sub','By subcontractor'],['cust','By customer'],['week','By week'],['day','By day']].map(x=>`<button data-k="${x[0]}" class="${x[0]===ACC_BY?'on':''}">${x[1]}</button>`).join('')+'</div></div>';
  html+='<div class="card"><div class="kv"><span>Truck readiness: <b>'+fmt(T.reg)+'</b></span><span>Actual: <b>'+fmt(T.act)+'</b></span>'+
    '<span>Not in truck registered: <b>'+fmt(T.nreg)+'</b></span><span>Total actual: <b>'+fmt(T.act+T.nreg)+'</b></span>'+
    '<span>%Accuracy: <b>'+(T.reg?(T.act/T.reg*100).toFixed(1):'0')+'%</b></span></div>'+
    '<div class="legend muted">As the Truck register file: a ticket is Actual when its contract + truck + loading date (or gate-in date) is in Truck readiness; %Accuracy = Actual &divide; Truck readiness'+(RAW.since?' · from '+dmy(RAW.since):'')+'.</div></div>';
  html+='<div class="card"><h2>Register vs actual &mdash; '+({sub:'by subcontractor',cust:'by customer',week:'by week',day:'by day'}[ACC_BY])+'</h2><div class="tableScroll"><table><thead><tr>'+
    ['Group','Truck readiness','Actual','Not in truck registered','Total actual','%Accuracy'].map((h,i)=>`<th class="${i===0?'l':''}">${h}</th>`).join('')+'</tr></thead><tbody>';
  if(!rows.length) html+='<tr><td colspan="6" class="empty">No readiness data for this market.</td></tr>';
  rows.forEach(r=>{ const lab=ACC_BY==='week'?wkLabel(r.g)+' (wk)':ACC_BY==='day'?dmy(r.g):r.g; const cls=!r.reg?'':r.acc>=80?'pos':(r.acc>=50?'':'neg');
    html+=`<tr><td class="l">${esc(lab)}</td><td>${fmt(r.reg)}</td><td>${fmt(r.act)}</td><td>${fmt(r.nreg)}</td><td>${fmt(r.act+r.nreg)}</td><td class="${cls}">${r.reg?r.acc.toFixed(1)+'%':'—'}</td></tr>`; });
  html+='</tbody></table></div></div>';
  $('#view').innerHTML=html;
  const e=$('#accby'); if(e) e.addEventListener('click',ev=>{ const b=ev.target.closest('button'); if(!b)return; ACC_BY=b.dataset.k; $$('#accby button').forEach(x=>x.classList.toggle('on',x===b)); renderAccuracy(); });
}

  box.innerHTML='<table><thead><tr>'+D.cols.map(c=>'<th class="'+(num(c[0])?'':'l')+'">'+c[1]+'</th>').join('')+'</tr></thead><tbody>'+
    (j.rows.length?j.rows.map(r=>'<tr>'+D.cols.map(c=>'<td class="'+(num(c[0])?'':'l')+'">'+cell(c[0],r[c[0]])+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+D.cols.length+'" class="empty">No rows'+(DL[k]&&DL[k].q?' match':'')+'.</td></tr>')+'</tbody></table>';
  const pg=$('#pg_'+k); if(pg&&DL[k]){ const from=j.page*j.size+1, to=Math.min(j.total,(j.page+1)*j.size);
    pg.innerHTML=j.total?(fmt(from)+'–'+fmt(to)+' of '+fmt(j.total)+' · newest first '+
      (j.page>0?'<button class="act" data-pg="'+k+'" data-d="-1" style="padding:3px 10px">‹ Newer</button> ':'')+
      (to<j.total?'<button class="act" data-pg="'+k+'" data-d="1" style="padding:3px 10px">Older ›</button>':'')):''; }
}
// one listener for the Data tab, wired once (the view is redrawn, not replaced)
document.getElementById('view').addEventListener('click',async e=>{
  if(TAB!=='data') return;
  const pb=e.target.closest('[data-pg]'); if(pb){ const k=pb.dataset.pg; DL[k].page=Math.max(0,DL[k].page+(+pb.dataset.d)); loadList(k); return; }
  const ub=e.target.closest('[data-up]');
  if(ub){ const kind=ub.dataset.up, f=$('#'+ub.dataset.in).files[0], msg=$('#msg_'+kind);
    if(!f){ msg.textContent='Choose a file first.'; return; }
    if(f.size>64*1024*1024){ msg.textContent='This file is '+Math.round(f.size/1048576)+' MB - over the 64 MB limit. Upload the daily exports into each list instead.'; return; }
    msg.textContent='Uploading and reading '+f.name+'… (a large workbook takes up to a minute)'; ub.disabled=true;
    try{ const fd=new FormData(); fd.append('file',f); const r=await fetch('/api/coalrpt/upload?kind='+kind,{method:'POST',body:fd});
      const j=await r.json().catch(()=>({error:'HTTP '+r.status}));
      if(!r.ok||j.ok===false){ msg.textContent='Not uploaded: '+(j.error||r.status); }
      else { const keep='Done · '+Object.keys(j.done).map(k=>DL_DEF[k].title+' '+fmt(j.done[k].rows)+' rows'+(j.done[k].from?' ('+dmy(j.done[k].from)+' → '+dmy(j.done[k].to)+')':'')).join(' · ')+(j.missing&&j.missing.length?' · not in this file: '+j.missing.join(', '):'');
        await reloadKeep(); const m2=$('#msg_'+kind); if(m2) m2.textContent=keep; } }
    catch(err){ msg.textContent='Not uploaded: '+err; }
    ub.disabled=false; return; }
  if(e.target.id==='rmBtn'){ const from=$('#rmFrom').value,to=$('#rmTo').value; if(!from&&!to){ $('#rmMsg').textContent='Pick a date range.'; return; }
    if(!confirm('Remove every Truck readiness row registered '+(from?'from '+dmy(from)+' ':'')+(to?'to '+dmy(to):'')+'?')) return;
    $('#rmMsg').textContent='Removing…';
    try{ const r=await fetch('/api/coalrpt/readiness/remove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({from,to})}); const j=await r.json(); const t='Removed '+fmt(j.removed)+' · '+fmt(j.total)+' left'; await reloadKeep(); const m=$('#rmMsg'); if(m) m.textContent=t; }catch(err){ $('#rmMsg').textContent='Error: '+err; } }
});
async function reloadKeep(){ try{ RAW=decode(await (await fetch('/api/coalrpt/data')).json()); }catch(e){} build(); renderData(); }

boot();
</script>
<script>
(function(){
  function ev(action, detail){ try{ fetch('/api/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:action,detail:'report: '+String(detail||'').slice(0,280)}),keepalive:true}); }catch(e){} }
  document.addEventListener('change', function(e){
    var i=e.target;
    if(i && i.tagName==='INPUT' && i.type==='file' && i.files && i.files.length){
      var n=[]; for(var j=0;j<i.files.length;j++) n.push(i.files[j].name);
      ev('upload', n.join(', '));
    }
  }, true);
  document.addEventListener('click', function(e){
    var b=e.target.closest && e.target.closest('button,a.btn,[role=button]'); if(!b) return;
    var s=(b.textContent||'').trim().slice(0,60);
    if(/upload|remove|delete|export|download/i.test(s)) ev(/export|download/i.test(s)?'export':(/remove|delete/i.test(s)?'delete':'upload'), s);
  }, true);
})();
</script>
