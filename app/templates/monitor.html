<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shift Monitor &middot; Coal project</title>
<style>
  :root{--bg:#0b1220;--panel:#111a2b;--line:#233149;--txt:#e7ecf5;--mut:#8b9ab4;
        --acc:#2dd4bf;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--blind:#60a5fa}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:#0e1728;
         border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;flex-wrap:wrap}
  h1{font-size:17px;margin:0}
  .sub{color:var(--mut);font-size:12px}
  .spacer{margin-left:auto}
  a{color:var(--acc);text-decoration:none;font-size:13px}
  /* Full width (user 2026-09-19). The 1500px cap centred the page and left both
     margins empty on a wide screen - room the track table now uses. */
  main{padding:18px;margin:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        padding:16px;margin-bottom:16px}
  .card.sticky{position:sticky;top:56px;z-index:40}
  h2{margin:0 0 4px;font-size:15px}
  .hint{color:var(--mut);font-size:12px;margin:0 0 12px}
  label.f{display:inline-flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mut)}
  input,select,button{font:inherit}
  input[type=date],select{background:#0c1523;color:var(--txt);
        border:1px solid var(--line);border-radius:8px;padding:7px 10px}
  button{background:#1e293b;color:var(--txt);border:1px solid var(--line);
         border-radius:8px;padding:8px 14px;cursor:pointer}
  button:hover{border-color:var(--acc)}
  .row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
  .stats{display:flex;gap:20px;margin-left:auto;flex-wrap:wrap;align-items:flex-end}
  .stat{text-align:center}
  .stat .n{font-size:20px;font-weight:800}
  .stat .l{font-size:10px;color:var(--mut);text-transform:uppercase}
  .banner{border-radius:10px;padding:11px 14px;margin-bottom:12px;font-size:13px;border:1px solid}
  .b-none{background:#1e293b55;border-color:var(--line);color:var(--mut)}
  .b-bad{background:#ef444418;border-color:#ef444466;color:#fca5a5}
  .b-ok{background:#22c55e18;border-color:#22c55e55;color:#86efac}

  /* The truck's plate, wherever one is shown. */
  .plate{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;
         background:#16233a;border:1px solid var(--line);border-radius:6px;padding:2px 7px}
  .msg{font-size:12px;color:var(--mut);margin-left:8px}
  table{width:100%;border-collapse:collapse;margin-top:4px}
  th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);
        font-size:12.5px;white-space:nowrap}
  th{color:#aab8d0;font-weight:700;font-size:10.5px;text-transform:uppercase;
     background:#131d30}
  tbody tr:hover{background:#16233a}
  td.plate{font-family:ui-monospace,Consolas,monospace}

  /* Four places, each holding a promise and what happened. The pair is boxed
     together so the eye reads across a location, not across the whole row. */
  table.grid th.loc{text-align:center;font-size:11.5px;letter-spacing:.6px;
        border-left:2px solid var(--line);background:#16203a}
  table.grid th.sub2{font-size:9.5px;color:var(--mut);font-weight:600;
        background:#101a2c}
  table.grid th.sub2:nth-of-type(odd){border-left:2px solid var(--line)}
  table.grid td.pl{color:var(--mut);border-left:2px solid var(--line);
        text-align:right;width:64px}
  table.grid td.ac{text-align:left;width:78px}
  table.grid td.ac b{font-weight:600}
  table.grid td.where{white-space:nowrap;max-width:230px;overflow:hidden;
        text-overflow:ellipsis}
  a.trail{color:#5ac8fa;text-decoration:none;font-size:10.5px;font-weight:600;
          margin-left:5px;opacity:.75;white-space:nowrap}
  a.trail:hover{opacity:1;text-decoration:underline}
  /* Thirty-three trucks scroll past the header long before the eye is done with
     them, so the header travels: both rows of it, under the filter bar. */
  table.grid thead th{position:sticky;z-index:6}
  table.grid thead tr:first-child th{top:var(--freeze,140px);height:26px}
  table.grid thead tr:nth-child(2) th{top:calc(var(--freeze,140px) + 26px)}

  /* Scrolling belongs to the browser (user 2026-09-19). The track used to sit
     in its own scroll box, which put a second pair of bars inside the window's
     own; now the table takes the width its columns need and the PAGE scrolls,
     sideways and down. The card grows with the table so the panel still runs
     under every column once the page is scrolled right, and the header rows
     freeze against the page under the filter bar (--freeze), not against a box. */
  #trackCard{width:max-content;min-width:100%}
  #track table.grid{width:max-content;min-width:100%;margin-top:0}
  /* The page is now wider than the window, so the two bars that stay put when
     it scrolls DOWN have to stay put when it scrolls SIDEWAYS as well. They are
     laid out against the whole scrolled width and held one window wide at the
     window's left edge; without that they slide off to the left, and the frozen
     table header - which parks under them - freezes over an empty strip with
     trucks showing above it. --vw is the window without its scrollbar, measured,
     because 100vw counts the scrollbar and would push the page wider still. */
  body{width:max-content;min-width:100%}
  header{left:0;width:var(--vw,100vw)}
  .card.sticky{left:18px;width:calc(var(--vw,100vw) - 36px)}
  /* The page's own side margins are the one strip the bar does not cover, and
     the table scrolls under them in plain sight. The bar carries its own
     backdrop across both of them - behind the panel, but inside the bar's
     stacking context, so it still hides everything passing below. */
  .card.sticky::before{content:'';position:absolute;top:0;bottom:0;left:-18px;
        right:-18px;background:var(--bg);z-index:-1}
  /* The identity columns - No#, Last location, Truck - stay put while the
     rest scrolls under them. Offsets are measured from the rendered widths
     (applyTrackFreeze), so a hidden No# or a wider plate just works. A pinned
     cell needs its own background or the scrolling cells show through it. */
  #track .frz{position:sticky;z-index:4;background:#0d1626}
  #track thead .frz{z-index:8}
  #track tbody tr:hover .frz{background:#16233a}
  #track .frz-last{box-shadow:4px 0 8px -4px rgba(0,0,0,.6)}
  #track thead th.frz{background:#131d30}

  .key{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:0 0 10px;
       font-size:11.5px;color:var(--mut)}
  .key b{font-weight:600}
  .key i{font-style:normal}
  .t-ok{color:var(--ok)}
  .t-early{color:var(--warn)}
  .t-late{color:var(--bad)}
  .t-dm{color:var(--mut);font-size:10px}
  td.rmk{width:200px}
  .rmk-in{width:192px;background:#0c1523;border:1px solid var(--line);border-radius:6px;
          color:var(--txt);padding:4px 7px;font:inherit;font-size:12px}
  .rmk-in:focus{border-color:var(--acc);outline:none}
  .rmk-in::placeholder{color:#5a6a85}
  /* An estimate is the one time on this table nobody measured. Pale grey,
     neutral where every confirmed time is tinted, so the eye passes over
     it and lands on what was actually seen. */
  .t-est{color:#A6A6A6}
  td.tel{white-space:nowrap}
  td.tel a{color:var(--acc);text-decoration:none;font-size:12px}
  td.tel a:hover{text-decoration:underline}
  td.tel a.wa{margin-left:7px;color:#25d366;border:1px solid #25d36655;
        border-radius:5px;padding:1px 6px;font-size:10.5px}
  td.tel a.waw{margin-left:5px;color:var(--mut);font-size:10px}
  td.tel .ph{margin-left:6px;font-size:9.5px;color:var(--warn);
        text-transform:uppercase;letter-spacing:.3px}

  /* sticky, NOT relative. `top` is set on every header cell so the row can
     freeze under the filter bar; on a RELATIVE cell that same `top` is an
     offset instead, and the sortable headers were shoved a hundred pixels down
     the table, over the trucks. Sticky is positioned too, so the arrow still
     has something to hang off. */
  #trackTable th.hd{cursor:pointer;position:sticky;padding-right:15px}
  #trackTable th.hd.sub2{padding-right:12px}
  #trackTable th.hd.sub2 .harrow{right:2px;font-size:8px}
  #trackTable th.hd:hover{background:#1d2a44}
  #trackTable th.filt-on{color:var(--acc)}
  #trackTable th.filt-on .harrow{color:var(--acc)}
  #trackTable .harrow{position:absolute;right:4px;top:50%;transform:translateY(-50%);
                      font-size:9px;color:var(--mut)}
  #trackTable .hl{display:block}
  #trackTable .hsort{margin-left:4px;color:var(--acc);font-size:9px}
  .col-menu{position:absolute;z-index:10000;background:var(--panel);
            border:1px solid var(--line);border-radius:10px;width:250px;
            box-shadow:0 12px 34px rgba(0,0,0,.55);display:flex;flex-direction:column;
            max-height:70vh;overflow:hidden}
  .col-menu .cm-sort{display:flex;border-bottom:1px solid var(--line)}
  .col-menu .cm-sort button{flex:1;padding:8px 6px;border:none;background:none;
      cursor:pointer;font-size:11.5px;color:var(--txt);font-weight:600;font-family:inherit}
  .col-menu .cm-sort button:hover{background:var(--panel2)}
  .col-menu .cm-sort2 button{font-size:10.5px;color:var(--mut);font-weight:500}
  .col-menu .cm-seq-in{padding:7px 9px;border-bottom:1px solid var(--line);
                       background:var(--panel2);line-height:1.8;font-size:10.5px}
  .col-menu .cm-seq-tag{display:inline-block;background:#1d3350;border-radius:7px;
                        padding:0 6px;margin-right:3px;font-weight:700;color:#5ac8fa}
  .col-menu .cm-seq-in button{margin-top:6px;width:100%;padding:4px;font-size:10.5px;
      border:1px solid var(--line);background:none;border-radius:5px;cursor:pointer;
      color:var(--bad);font-weight:700;font-family:inherit}
  .col-menu .cm-search{margin:8px 9px 5px;padding:6px 9px;background:#0b1020;
      border:1px solid var(--line);border-radius:7px;font-size:11.5px;color:var(--txt);
      font-family:inherit;outline:none}
  .col-menu .cm-list{overflow-y:auto;padding:2px 5px;flex:1 1 auto;min-height:60px}
  .col-menu .cm-item{display:flex;align-items:center;gap:8px;font-size:11.5px;
      padding:4px 7px;border-radius:5px;cursor:pointer;color:var(--txt)}
  .col-menu .cm-item:hover{background:var(--panel2)}
  .col-menu .cm-item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .col-menu .cm-item i{color:var(--mut);font-style:normal;font-size:10px}
  .col-menu .cm-actions{display:flex;gap:6px;padding:8px 9px;border-top:1px solid var(--line)}
  .col-menu .cm-actions button{flex:1;padding:6px 0;font-size:11.5px;
      border:1px solid var(--line);border-radius:6px;background:none;color:var(--txt);
      cursor:pointer;font-family:inherit}
  .col-menu .cm-actions .cm-apply{background:var(--acc);color:#04201c;
      border-color:var(--acc);font-weight:700}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg button{background:transparent;border:0;border-radius:0;color:var(--mut);
              padding:5px 13px;font-size:12.5px;line-height:1.25;text-align:center}
  .seg button small{display:block;font-size:9.5px;color:var(--mut);
              text-transform:uppercase;letter-spacing:.3px}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button:hover{color:var(--txt);background:#16233a}
  .seg button.on{background:#16233a;color:var(--acc);font-weight:700}
  .seg button.on small{color:var(--acc)}
  /* Embedded in the operations shell: the shell supplies the header, so the
     page's own one would be a second title bar saying the same thing. */
  body.embed > header{display:none}
  body.embed main{padding-top:12px}
  body.embed .card.sticky{top:0}
</style>

<body class="">
<script>
if (location.search.indexOf('embed=1') >= 0) document.body.classList.add('embed');
</script>

<header>
  <div><h1>Shift Monitor</h1>
    <div class="sub">what this shift has to confirm &middot; answered from GPS &middot;
      local time (UTC+7)</div></div>
  <div class="spacer"></div>
  <a href="/shift-board">Supervisor</a>
  <a href="/planner">Planner</a>
  <a href="/tool">Tool</a>
  <a href="/logout" style="color:var(--mut)">Log out</a>
</header>
<script src="/static/daypick.js?v={{ asset_v('daypick.js') }}"></script>
<script src="/static/tableview.js?v={{ asset_v('tableview.js') }}"></script>
<main>
  <div class="card sticky">
    <div class="row">
      <label class="f">Day at the mine &mdash; when the trucks run
        <select id="day"></select></label>
      <button id="run">Refresh</button>
      <button id="sendPlan" title="Each driver's dispatch message over WhatsApp,
prefilled from the issued plan - the same page as Plan &rarr; Send Plan.">
        &#128228; Send plan</button>
      <label class="f" style="flex-direction:row;gap:6px;align-items:center;
             align-self:center">
        <input type="checkbox" id="auto" checked>every 60 s</label>
      <span class="msg" id="stamp"></span>
      <div class="stats" id="stats"></div>
    </div>
  </div>

  <div class="card" id="trackCard">
    <div class="row" style="align-items:center;margin-bottom:2px">
      <h2 style="margin:0">Every truck &mdash; the plan against what happened</h2>
      <div class="seg" id="legToggle" style="margin-left:auto">
        <button data-leg="fh" class="on">FH<small>loaded, mine &rarr; port</small></button>
        <button data-leg="bh">BH<small>empty, port &rarr; mine</small></button>
      </div>
    </div>
    <p class="hint" id="trackHint"></p>
    <div id="track"></div>
  </div>

  <div id="body"></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const jget = async u => (await fetch(u)).json();
let PICKER = null;
const todayStr = () => new Date(Date.now() + 7*3600*1000).toISOString().slice(0,10);
let TIMER = null, SUBID = '', SUBS = [], TV = null, SHIFTS = [];

const stat = (n, l, c) =>
  '<div class="stat"><div class="n" style="color:' + (c || 'var(--txt)') + '">' + n + '</div>'
  + '<div class="l">' + esc(l) + '</div></div>';

async function loadConfig(){
  // The Shift and Company pickers are gone: the corridor is one day, not one
  // company's day, so the page watches every company; and the checks card
  // reports the shift covering the clock RIGHT NOW - its own heading still
  // names which shift that is.
  const c = await jget('/api/shift/config');
  SHIFTS = c.shifts || [];
  const j = await jget('/api/shift/subcontractors');
  SUBS = j.subcontractors || [];
  const canSeeAll = (j.role !== 'subcontractor');
  if (j.role === 'subcontractor' && j.mine) SUBID = String(j.mine);
  if (!SUBID) SUBID = canSeeAll ? 'all' : (SUBS[0] ? String(SUBS[0].id) : 'none');
}

// -- every truck: plan against actual, by place -------------------------------
// The same four columns whichever leg is shown, because they are places, not
// steps: a truck passes each of them twice and the pair only makes sense if it
// stays in the same column.
const clock = s => s ? s.slice(11, 16) : '';
const dayOf = s => s ? (s.slice(8, 10) + '/' + s.slice(5, 7) + '/' + s.slice(0, 4)) : '';
const dm = s => s ? (s.slice(8, 10) + '/' + s.slice(5, 7)) : '';   // 16/09, day first
let LEG = 'fh', TRACK = null;

// Inside the tolerance a truck is on plan and the time is left alone. Outside
// it, the row has to say which way it went: yellow for early, red for late.
let TOL = 60;
const gap = m => (Math.abs(m) >= 60
  ? (Math.abs(m) / 60).toFixed(1).replace(/\.0$/, '') + ' h'
  : Math.abs(m) + ' m');

// The same link the supervisor and the manager have. A place and a time on
// this table is a claim; the trail is where you go to see whether it holds -
// and "not seen" is the row that most needs asking about, so the link is there
// too, on the trucks with nothing to show.
function trailLink(plate){
  if (!plate) return '';
  return ' <a class="trail" target="_blank" rel="noopener" title="GPS trail, '
    + 'yesterday to now" href="/truck-trail?plate=' + encodeURIComponent(plate)
    + '">◎ trail</a>';
}

function cellHtml(c, planDay){
  if (c.actual){
    const d = c.delay;
    if (d === null || d === undefined || Math.abs(d) <= TOL)
      return '<b class="t-ok">' + clock(c.actual) + '</b>';
    const cls = d < 0 ? 't-early' : 't-late';
    return '<b class="' + cls + '">' + clock(c.actual) + '</b>'
      + ' <span class="' + cls + '" style="font-size:10.5px">'
      + (d < 0 ? '&minus;' : '+') + gap(d) + '</span>';
  }
  if (c.estimate)
    return '<span class="t-est" title="estimate">~' + dm(c.estimate) + ' '
      + clock(c.estimate) + '</span>';
  return '<span style="color:var(--mut)">&mdash;</span>';
}

// A number on the screen is only useful if it dials. tel: hands the call to
// whatever the device uses to make calls.
//
// WhatsApp goes through the whatsapp:// handler rather than wa.me on purpose:
// wa.me always lands on WhatsApp's own "Open app / Continue to Web" page,
// because a web link cannot know whether the app is installed. The handler hands
// straight to the desktop app. The small "web" link beside it is for a machine
// that has no app installed, where the handler does nothing at all.
function phoneCell(r){
  const digits = String(r.phone || '').replace(/[^0-9]/g, '');
  if (!digits) return '<span style="color:var(--mut)">&mdash;</span>';
  return '<a href="tel:' + esc(r.phone) + '" title="Call this number">'
    + esc(r.phone) + '</a>'
    + '<a class="wa" title="Open the chat in the WhatsApp app"'
    + ' href="whatsapp://send?phone=' + digits + '">WhatsApp</a>'
    + '<a class="waw" target="_blank" rel="noopener"'
    + ' title="Open the chat in WhatsApp Web, for a machine without the app"'
    + ' href="https://web.whatsapp.com/send?phone=' + digits + '">web</a>'
    + (r.phone_known ? '' : '<span class="ph">placeholder</span>');
}

/* Pin the identity columns on the left of the track (user 2026-09-19). Which
   ones is decided by class - No#, Last location, Truck - and the offsets are
   measured from the header cells as rendered, so widths are never guessed.
   Header cells for these columns live on the FIRST header row (rowspan 2);
   body cells are matched by class in each row. */
// Everything that says WHICH truck this is travels with the eye - through the
// team's own remark (user 2026-09-19), so a note written about a truck is still
// beside it when the row is scrolled out to the far events. Only the times move.
// A column is named by its header key; the body cell's class is not always the
// same word, so it is carried here rather than guessed.
const TRACK_FREEZE = [
  {col: 'c-no',   cell: 'c-no'},
  {col: 'where',  cell: 'where'},
  {col: 'plate',  cell: 'plate'},
  {col: 'phone',  cell: 'tel'},
  {col: 'sub',    cell: 'c-sub'},
  {col: 'remark', cell: 'rmk'}
];
function applyTrackFreeze(){
  const tbl = document.getElementById('trackTable');
  if (!tbl || !tbl.tHead || !tbl.tHead.rows || !tbl.tHead.rows.length) return;
  tbl.querySelectorAll('.frz').forEach(el => { el.classList.remove('frz', 'frz-last'); el.style.left = ''; });
  const head = Array.from(tbl.tHead.rows[0].cells);
  const pinned = [];        // [{cls, th}], in column order, only while contiguous from the left
  for (const th of head){
    const col = TRACK_FREEZE.find(c => th.classList.contains(c.col)
      || th.getAttribute('data-col') === c.col);
    if (!col) break;
    pinned.push({cls: col.cell, th});
  }
  if (!pinned.length) return;
  // The pinned block parks against the window's own edge, not the card's. Park
  // it at the card's edge instead and the rest of the table scrolls through the
  // strip of page margin left beside it, in plain sight.
  let left = 0;
  pinned.forEach((p, n) => {
    const w = p.th.offsetWidth || 0;
    p.th.classList.add('frz'); p.th.style.left = left + 'px';
    if (n === pinned.length - 1) p.th.classList.add('frz-last');
    p.left = left; left += w;
  });
  const body = tbl.tBodies && tbl.tBodies[0];
  if (!body) return;
  for (const tr of body.rows){
    pinned.forEach((p, n) => {
      const td = Array.from(tr.cells).find(c => c.classList.contains(p.cls));
      if (!td) return;
      td.classList.add('frz'); td.style.left = p.left + 'px';
      if (n === pinned.length - 1) td.classList.add('frz-last');
    });
  }
}
/* Column widths are measured, so a resize re-measures the pinned ones. */
window.addEventListener('resize', applyTrackFreeze);

function drawTrack(){
  const d = TRACK;
  if (!d) return;
  // Somebody mid-sentence in a remark must not have the row rebuilt under
  // their cursor by the 60-second refresh. Their save lands on change; the
  // next refresh paints it.
  const ae = document.activeElement;
  if (ae && ae.classList && ae.classList.contains('rmk-in')) return;
  const s = d.summary;
  TOL = d.on_time_minutes || 60;
  // Nothing is issued: there is no promise for the day, so there is nothing
  // here to be right or wrong about. Saying so beats scoring trucks against a
  // plan the planner has not committed to.
  if (d.issued === false){
    $('#trackHint').innerHTML = 'No plan has been issued for this day yet. '
      + 'The planner issues it from <b>Planner &rarr; Revision</b>, and it appears '
      + 'here the moment they do.';
    $('#track').innerHTML = '<div class="banner b-none">'
      + '<b>Waiting for the planner.</b><br>'
      + 'Until a plan is issued there is nothing to measure against, so no truck '
      + 'is shown as on time, late or missed here.</div>';
    return;
  }
  $('#trackHint').innerHTML = 'Plan from the ' + esc(d.source)
    + '. Within <b>' + TOL + ' minutes</b> of plan counts as on time; outside it a '
    + 'truck is <b class="t-early">early</b> or <b class="t-late">late</b>. '
    + '<span class="t-est">A grey time is an estimate</span>, not something GPS '
    + 'confirmed &mdash; the plan carried forward by however late the truck is, or '
    + 'for one still on the road, the distance left over the empty-running speed. '
    + s.trucks + ' trucks &middot; ' + s.on_the_road + ' on the road &middot; '
    + s.late + ' running late'
    + (s.early ? ' &middot; ' + s.early + ' early' : '')
    + (s.worst_late ? ' (worst ' + s.worst_late + ' min)' : '') + '.'
    + (LEG === 'bh' ? ' <b>Back-haul reads port first</b>, then QL49, border and '
       + 'home, the way the truck runs it. The plan times only the two ends.' : '');

  if (!d.rows.length){
    $('#track').innerHTML = '<div class="banner b-none">No trucks for this day.</div>';
    return;
  }
  // Going home the truck runs port, QL49, border, mine - so the columns run that
  // way too. Reading a journey backwards is harder than moving four headings.
  // The server names each leg's events in that leg's journey order. (An
  // older answer sent one array for both legs, with the run home to be read
  // backwards - kept readable so a saved page from before still draws.)
  const locs = Array.isArray(d.locations)
    ? (LEG === 'bh' ? d.locations.slice().reverse() : d.locations)
    : (d.locations[LEG] || []);
  const key = '<div class="key">'
    + '<span><b class="t-ok">14:24</b> <i>on time, within ' + TOL + ' min of plan</i></span>'
    + '<span><b class="t-early">14:24 &minus;1.6 h</b> <i>early</i></span>'
    + '<span><b class="t-late">14:24 +2.2 h</b> <i>late</i></span>'
    + '<span><b class="t-est">~14:24</b> <i>estimate, not confirmed</i></span>'
    + '<span><b style="color:var(--mut)">&mdash;</b> <i>nothing planned or seen</i></span>'
    + '</div>';
  // Going home the truck runs port, QL49, border, mine, so the cells are read
  // back to front on the back-haul - the same reversal the headings get.
  const cellsOf = r => (LEG === 'bh'
    ? (Array.isArray(d.locations) ? r.bh.slice().reverse() : r.bh)
    : r.fh);
  const whereOf = r => r.last_seen ? r.last_seen.place
                     : (r.enroute ? 'on the road' : 'not seen');
  // Places order along the corridor, mine first - not alphabetically, where
  // QL49 lands ahead of the mine. The default row order and the column's own
  // sort both follow the road.
  const RANK = {};
  locs.forEach(function(l, i){ RANK[l.label] = i; });
  const wherePos = r => r.last_seen
    ? (RANK[r.last_seen.place] !== undefined ? RANK[r.last_seen.place] : 6)
    : (r.enroute ? 8 : 9);
  d.rows.sort(function(a, b){
    return (wherePos(a) - wherePos(b))
      || String(a.plate).localeCompare(String(b.plate));
  });
  const rkey = p => String(p || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const remarkOf = r => (d.remarks || {})[rkey(r.plate)] || {};
  // What a time cell IS, in the words the key at the top of the table uses.
  // The clock sorts; this is what the filter menu offers, because "show me the
  // late ones" is the question, and a menu of fifty-eight distinct times is
  // not an answer to it.
  const stateOf = c => {
    if (c.actual){
      const g = c.delay;
      if (g === null || g === undefined || Math.abs(g) <= TOL) return 'on time';
      return g < 0 ? 'early' : 'late';
    }
    return c.estimate ? 'estimate' : 'not seen';
  };
  if (!TV) TV = new TableView({cols: [], onChange: () => drawTrack()});

  // Rebuilt every draw: the place columns belong to the leg on screen, and
  // flipping FH/BH turns them round. Keyed by leg and place, never by position,
  // so a filter set on the Mine column stays on the Mine column.
  // Last location leads. It is the column the eye goes to first - where is
  // this truck now - and it was sitting past eight columns of times on the far
  // right, which is the last place anybody looks.
  const idCols = [
    // The sort value leads with the corridor position, so sorting this column
    // reads mine -> border -> QL49 -> port; the filter menu still offers the
    // plain place names.
    {key:'where', label:'Last location', rowspan:2,
     get: r => wherePos(r) + ' ' + whereOf(r), fget: whereOf},
    {key:'plate', label:'Truck',         rowspan:2},
    {key:'phone', label:'Phone',         rowspan:2, get: r => r.phone || ''},
    {key:'sub',   label:'Sub',           rowspan:2, get: r => r.sub || ''},
    {key:'remark', label:'Team remark',  rowspan:2,
     get: r => remarkOf(r).text || '',
     fget: r => (remarkOf(r).text ? 'has remark' : 'blank')}
  ];
  const placeCols = [];
  locs.forEach(function(l, j){
    // The sort runs on the full timestamp, not the clock: an estimate that
    // lands after midnight is later than 23:00, and "00:40" is not.
    placeCols.push({
      key: LEG + ':' + l.key + ':plan', label: 'Plan', cls: 'sub2',
      tag: l.label + ' plan',
      get:  r => cellsOf(r)[j].plan || '',
      fget: r => clock(cellsOf(r)[j].plan) || ''
    });
    placeCols.push({
      key: LEG + ':' + l.key + ':act', label: 'Actual', cls: 'sub2',
      tag: l.label + ' actual',
      get:  r => { const c = cellsOf(r)[j]; return c.actual || c.estimate || ''; },
      fget: r => stateOf(cellsOf(r)[j])
    });
  });
  TV.cols = idCols.concat(placeCols);
  // A filter or a sort held on the other leg's columns is not silently carried
  // over: those columns are not on screen and the footer could not honestly
  // count what they hide.
  Object.keys(TV.filters).forEach(function(k){ if (!TV.byKey(k)) delete TV.filters[k]; });
  TV.sortSeq = TV.sortSeq.filter(lv => TV.byKey(lv.key));

  TV.rows = d.rows;
  const view = TV.view(d.rows);
  const hidden = d.rows.length - view.length;

  $('#track').innerHTML = key +
    '<table class="grid" id="trackTable"><thead>'
    // Spans both header rows, so it sits with the other identifying columns
    // rather than taking a Plan/Actual sub-heading it has no use for.
    + '<tr>' + noHead2() + idCols.map(c => TV.head(c)).join('')
    + locs.map(l => '<th colspan="2" class="loc">' + esc(l.label) + '</th>').join('')
    + '</tr>'
    + '<tr>' + placeCols.map(c => TV.head(c)).join('')
    + '</tr></thead><tbody>'
    + view.map(function(i, n){
        const r = d.rows[i];
        return (function(r){
        const cs = cellsOf(r);
        const where = r.last_seen
          ? esc(r.last_seen.place) + ' <span style="color:var(--mut)">'
            + clock(r.last_seen.at) + '</span>'
          : (r.enroute
             ? '<span style="color:var(--blind)">on the road</span> '
               + '<span style="color:var(--mut)">' + r.enroute.km_to_mine + ' km out</span>'
             : '<span style="color:var(--mut)">not seen</span>');
        const rm = remarkOf(r);
        return '<tr>' + rowNo(n) + '<td class="where">' + where + trailLink(r.plate) + '</td>'
          + '<td class="plate">' + esc(r.plate) + '</td>'
          + '<td class="tel">' + phoneCell(r) + '</td>'
          + '<td class="c-sub" style="color:var(--mut)">' + esc(r.sub || '') + '</td>'
          + '<td class="rmk"><input class="rmk-in" maxlength="300"'
            + ' data-plate="' + esc(r.plate) + '"'
            + ' value="' + esc(rm.text || '') + '"'
            + (rm.by ? ' title="' + esc(rm.by + (rm.at ? ' · ' + rm.at : '')) + '"' : '')
            + ' placeholder="note for the team…"></td>'
          + cs.map(c => '<td class="pl">'
              + (c.plan ? '<span class="t-dm">' + dm(c.plan) + '</span> ' + clock(c.plan)
                        : '<span style="color:var(--mut)">&mdash;</span>')
              + '</td><td class="ac">' + cellHtml(c, dayOf(c.plan)) + '</td>').join('')
          + '</tr>';
        })(r);
      }).join('')
    + '</tbody></table>'
    + (hidden > 0 ? '<div class="empty" style="margin-top:6px">' + hidden
        + ' truck(s) hidden by a filter.</div>' : '')
    + (d.not_planned_count ? '<div class="empty" style="margin-top:6px">'
        + d.not_planned_count + ' approved truck(s) are not in the issued plan, so they '
        + 'are not watched here: ' + esc((d.not_planned || []).join(', ')) + '</div>' : '');
  TV.wire(document.getElementById('trackTable'));
  applyTrackFreeze();
  // A remark saves when the writer leaves the box; the answer comes back with
  // the writer's name on it so the next shift knows who to ask.
  document.querySelectorAll('#trackTable .rmk-in').forEach(function(inp){
    inp.addEventListener('change', async function(){
      try {
        const r = await fetch('/api/shift/track/remark', {method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({date: $('#day').value, plate: inp.dataset.plate,
                                text: inp.value})});
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || 'Could not save');
        (TRACK.remarks = TRACK.remarks || {})[j.key] =
          {text: j.text, by: j.by, at: j.at};
        inp.title = j.by + ' · ' + j.at;
        inp.style.borderColor = 'var(--ok)';
        setTimeout(function(){ inp.style.borderColor = ''; }, 1200);
      } catch (e) { alert(e.message || 'Could not save the remark'); }
    });
  });
  measure();
}

async function loadTrack(){
  const sub = SUBID;
  TRACK = await jget('/api/shift/track?date=' + $('#day').value
    + (sub && sub !== 'none' ? '&subcontractor_id=' + encodeURIComponent(sub) : ''));
  drawTrack();
}

document.querySelectorAll('#legToggle button').forEach(b => b.onclick = () => {
  LEG = b.dataset.leg;
  document.querySelectorAll('#legToggle button').forEach(x =>
    x.classList.toggle('on', x === b));
  drawTrack();
});

// Re-picked on every refresh, so a page left open overnight follows the
// shift change instead of reporting the one it opened on.
function currentShiftId(){
  const hm = new Date(Date.now() + 7*3600*1000).toISOString().slice(11, 16);
  const cur = SHIFTS.find(s => (s.start <= s.end)
    ? (hm >= s.start && hm < s.end)       // a day shift
    : (hm >= s.start || hm < s.end));     // one that wraps midnight
  return String((cur || SHIFTS[0] || {}).id || '');
}

async function run(){
  const sub = SUBID;
  const d = await jget('/api/shift/board?date=' + $('#day').value
    + '&shift_id=' + currentShiftId()
    + (sub && sub !== 'none' ? '&subcontractor_id=' + encodeURIComponent(sub) : ''));
  $('#stamp').textContent = 'read ' + new Date().toTimeString().slice(0, 8);
  loadTrack();

  if (d.error){
    $('#stats').innerHTML = '';
    $('#body').innerHTML = '<div class="card"><div class="banner b-bad">'
      + esc(d.error) + '</div></div>';
    return;
  }
  if (d.dormant){
    $('#stats').innerHTML = '';
    $('#body').innerHTML = '<div class="card">'
      + '<h2>' + esc(d.shift.name) + ' &middot; ' + esc(d.shift.start) + '-'
      + esc(d.shift.end) + '</h2>'
      + '<div class="banner b-none" style="margin-top:10px">' + esc(d.dormant_reason)
      + '</div>'
      + '<p class="hint">Monitoring follows the truck list. Nothing is expected of a '
      + 'shift until a list is confirmed, so this page stays quiet rather than '
      + 'inventing work.</p></div>';
    return;
  }

  const tot = d.checks.reduce((a, c) => ({
    done: a.done + c.done_count, pend: a.pend + c.pending_count,
    miss: a.miss + c.missed_count, unv: a.unv + c.unverified_count}),
    {done:0, pend:0, miss:0, unv:0});

  $('#stats').innerHTML = stat(d.trucks, 'trucks')
    + stat(tot.done, 'done', 'var(--ok)')
    + stat(tot.pend, 'expected', tot.pend ? 'var(--warn)' : null)
    + stat(tot.miss, 'missed', tot.miss ? 'var(--bad)' : null)
    + stat(tot.unv, 'cannot verify', tot.unv ? 'var(--blind)' : null);

  // The shift's own summary used to be repeated here as a card per checkpoint
  // (user 2026-09-19: removed). The counters above the table say the same
  // thing in one line, and the track below says it truck by truck.
  $('#body').innerHTML = '';
}

// The frozen header parks under the header and the filter bar, whatever height
// those happen to be - and under nothing at all when the page is embedded.
function measure(){
  const bar = document.querySelector('.card.sticky');
  const hdr = document.querySelector('header');
  const h = (hdr ? hdr.getBoundingClientRect().height : 0)
    + (bar ? bar.getBoundingClientRect().height : 0);
  const de = document.documentElement;
  de.style.setProperty('--freeze', Math.round(h) + 'px');
  // clientWidth is the window WITHOUT the vertical scrollbar; 100vw includes it,
  // and a bar 15px too wide is 15px of horizontal scroll nobody asked for.
  if (de.clientWidth) de.style.setProperty('--vw', de.clientWidth + 'px');
}
window.addEventListener('resize', measure);

function arm(){
  if (TIMER) clearInterval(TIMER);
  if ($('#auto').checked) TIMER = setInterval(run, 60000);
}

// #day is a DayPick now: it calls run() through onPick.
$('#run').onclick = run;
// The monitor is often the one chasing drivers, so Send Plan is one press
// away instead of a trip through the Plan menu. Opens in its own tab - the
// board keeps watching while messages go out.
$('#sendPlan').onclick = () => window.open('/tool#send', '_blank');
$('#auto').onchange = arm;

(async function(){
  $('#day').value = todayStr();
  try {
    // Run days, not sheet days: this page watches what happened at the mine.
    PICKER = new DayPick({select: $('#day'), detail: true, source: 'run',
                          onPick: () => run()});
    await PICKER.load(null);
  } catch (e) { /* fall back to today */ }
  await loadConfig();
  await run();
  arm();
})();
</script>
</body>
