<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Process &middot; where the day stands</title>
<style>
  :root{--bg:#0b1220;--panel:#111a2b;--line:#233149;--txt:#e7ecf5;--mut:#8b9ab4;
        --acc:#2dd4bf;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:#0e1728;
         border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;flex-wrap:wrap}
  body.embed > header{padding:4px 0 10px;background:var(--bg);border-bottom:0}
  body.embed > header > div:first-child, body.embed > header > a{display:none}
  h1{font-size:17px;margin:0}
  .sub{color:var(--mut);font-size:12px}
  .spacer{margin-left:auto}
  a{color:var(--acc);text-decoration:none;font-size:13px}
  main{padding:16px;max-width:1200px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
        padding:16px 18px;margin-bottom:14px}
  .day{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 4px}
  .day h2{margin:0;font-size:15px}
  .chip{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
        padding:2px 9px;border-radius:999px;background:#16233a;border:1px solid var(--line);
        color:var(--acc)}
  .co{color:var(--mut);font-size:12px;margin:10px 0 6px;font-weight:600}

  /* The chain: five steps joined by a rail. The colour is the answer - green
     is behind us, amber is where the day is stuck, grey has not been reached. */
  .steps{display:flex;align-items:flex-start;gap:0;flex-wrap:wrap;margin:8px 0 2px}
  .step{display:flex;flex-direction:column;align-items:center;min-width:120px;flex:1;
        position:relative;text-align:center;padding:0 6px}
  .step::before{content:'';position:absolute;top:13px;left:-50%;width:100%;height:2px;
        background:var(--line);z-index:0}
  .step:first-child::before{display:none}
  .step.p-done::before{background:var(--ok)}
  /* On a day with no coal load nothing flows down the chain, so the rail
     stays grey the whole way - the ticks say who did their part, the rail
     says what moved, and here nothing did. */
  .steps.noload .step::before{background:var(--line)}
  .dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;
       justify-content:center;font-size:13px;font-weight:800;z-index:1;
       background:#16233a;border:2px solid var(--line);color:var(--mut)}
  .s-done .dot{background:#12301f;border-color:var(--ok);color:#5fd97e}
  /* Nothing for this desk to do. Not a tick - a tick says a person did their
     work - and not amber, because nothing is stuck. A dash in a dashed ring. */
  .s-none .dot{background:transparent;border-style:dashed;border-color:#3d4d6b;color:#5a6a85}
  .s-none .who{color:#5a6a85;font-weight:400;text-decoration:line-through;
       text-decoration-color:#3d4d6b}
  .s-none .note{color:#5a6a85}
  /* Missed (05/10/2026): the run day came and no sheet ever did. Red, the
     one colour on this page that means a desk failed its part. */
  .s-missed .dot{background:#3a1414;border-color:var(--bad);color:#fca5a5}
  .s-missed .who{color:#fca5a5}
  .s-waiting .dot,.s-doing .dot{background:#3a2a10;border-color:var(--warn);color:#fcd34d;
       box-shadow:0 0 0 4px rgba(245,158,11,.15)}
  .who{font-size:11.5px;font-weight:700;margin-top:6px}
  .s-idle .who{color:var(--mut);font-weight:400}
  .s-waiting .who,.s-doing .who{color:var(--warn)}
  .s-done .who{color:#5fd97e}
  .note{font-size:10.5px;color:var(--mut);margin-top:2px;max-width:180px;line-height:1.4}
  .win{font-size:9.5px;color:#5a6a85;margin-top:2px;letter-spacing:.2px}
  .win.late{color:var(--bad);font-weight:700}
  /* When the desk actually did it, and who (02/10/2026). Green inside its
     window, amber after it - late is a fact about the day, not an alarm. */
  .at{font-size:10.5px;color:#86efac;margin-top:3px;font-weight:600;
      font-variant-numeric:tabular-nums}
  .at.late{color:var(--warn)}
  .at .by{font-weight:400;opacity:.85}
  .at.again{color:var(--mut);font-weight:400;margin-top:1px}

  .now{margin-top:12px;padding:9px 13px;border-radius:9px;font-size:12.5px;
       background:#2a1f10;border:1px solid #5a4020;color:#fcd34d}
  .now.ok{background:#12301f;border-color:#1e5a34;color:#86efac}
  .now.miss{background:#2a1214;border-color:#6b2226;color:#fca5a5}
  .chip.miss{color:#fca5a5;border-color:#6b2226;background:#2a1214}
  .card.missed{border-color:#6b2226}
  .tally{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;font-size:13px}
  .tally b{text-transform:uppercase;letter-spacing:.4px;font-size:11px}
  .tally.bad{background:#2a1214;border-color:#6b2226;color:#fca5a5}
  .tally.good{color:#86efac}
  /* A day with no coal load. Above the chain, because it is the first thing
     to know about the day - and in a colour of its own: not the amber of a
     day that is stuck, not the green of a day that ran. */
  .noload{margin:8px 0 2px;padding:10px 14px;border-radius:9px;font-size:13px;
       background:#141d33;border:1px solid #2b3d66;color:#b7c6ea}
  .noload b{display:block;text-transform:uppercase;letter-spacing:.5px;font-size:12px;
       color:#dbe4ff;margin-bottom:2px}
  .now b{text-transform:uppercase;letter-spacing:.4px;font-size:11px}
  .msg{color:var(--mut);font-size:12px}
</style>
<script src="/static/datefmt.js?v={{ asset_v('datefmt.js') }}"></script>
</head>
<body class="">
<script>
if (location.search.indexOf('embed=1') >= 0) document.body.classList.add('embed');
</script>
<header>
  <div><h1>Process</h1>
    <div class="sub">where each day stands, and whose desk it is on</div></div>
  <div class="spacer"></div>
  <span class="msg" id="stamp"></span>
  <a href="/ops">Operations</a>
  <a href="/logout" style="color:var(--mut)">Log out</a>
</header>
<main id="body"><div class="card msg">Loading&hellip;</div></main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const jget = async u => (await fetch(u)).json();
const dmy = iso => iso.slice(8,10) + '/' + iso.slice(5,7) + '/' + iso.slice(0,4);
const MARK = {done:'✓', waiting:'⏳', doing:'⏳', idle:'·', none:'—', missed:'✕'};

// "declared 02/10 11:42 · khanhtd · 1 h 12 m late". The full date, the whole
// login and - for the company - when the sheet was first filed are on hover.
const DID = {declare: 'declared', submit: 'submitted', approve: 'approved', plan: 'issued'};
function lateText(m){
  return m < 60 ? m + ' m' : Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + (m % 60) + ' m' : '');
}
function atHtml(s){
  if (!s.at) return '';
  const hm = t => t.slice(8, 10) + '/' + t.slice(5, 7) + ' ' + t.slice(11, 16);
  const did = DID[s.key] || 'done';
  const late = s.late_min > 0;
  const tip = did + ' ' + dmy(s.at) + ' ' + s.at.slice(11, 16) + (s.by ? ' by ' + s.by : '')
    + (s.first_at ? ' - first filed ' + hm(s.first_at) : '')
    + (s.again_at ? ' - issued again ' + hm(s.again_at) : '');
  return '<div class="at' + (late ? ' late' : '') + '" title="' + esc(tip) + '">'
    + esc(did + ' ' + hm(s.at))
    + (s.by ? '<span class="by"> &middot; ' + esc(String(s.by).split('@')[0]) + '</span>' : '')
    + (late ? ' &middot; ' + esc(lateText(s.late_min)) + ' late' : '') + '</div>'
    + (s.again_at ? '<div class="at again">issued again ' + esc(hm(s.again_at)) + '</div>' : '');
}

function stepHtml(s){
  return '<div class="step s-' + s.state + (s.state === 'done' ? ' p-done' : '') + '">'
    + '<div class="dot">' + (MARK[s.state] || '·') + '</div>'
    + '<div class="who">' + esc(s.who) + '</div>'
    + (s.window ? '<div class="win' + (s.overdue ? ' late' : '') + '">'
        + esc(s.window) + (s.overdue ? ' — passed' : '') + '</div>' : '')
    + atHtml(s)
    + (s.note ? '<div class="note">' + esc(s.note) + '</div>' : '')
    + '</div>';
}

function draw(d){
  const days = d.days || [];
  if (!days.length){
    $('#body').innerHTML = '<div class="card msg">Nothing declared yet.</div>';
    return;
  }
  // The days the chain broke, said first: a missed day is a card further
  // down, and the person who most needs to know may not scroll to it.
  const miss = d.missed || [];
  const tally = miss.length
    ? '<div class="card tally bad"><b>Missed in the last ' + esc(d.back) + ' days: '
      + miss.length + '</b><span>' + miss.map(m => dmy(m.date)
        + (m.company ? ' ' + esc(m.company) : '')).join(' &middot; ')
      + ' &mdash; no sheet declared, so no plan for the day.</span></div>'
    : '<div class="card tally good"><b>No missed days</b><span>in the last '
      + esc(d.back) + ' days every run day had a sheet declared.</span></div>';
  $('#body').innerHTML = tally + days.map(day => {
    const dayMissed = day.companies.some(c => c.missed);
    const chips = (day.tomorrow ? '<span class="chip">tomorrow</span>' : '')
      + (day.today ? '<span class="chip">today</span>' : '')
      + (dayMissed ? '<span class="chip miss">missed</span>' : '');
    const cos = day.companies.map(c => {
      if (c.missed){
        return (c.company ? '<div class="co">' + esc(c.company) + '</div>' : '')
          + '<div class="steps">' + c.stages.map(stepHtml).join('') + '</div>'
          + '<div class="now miss"><b>Missed</b> &mdash; ' + esc(c.now.note)
          + (c.now.window ? ' &middot; the sheet was due ' + esc(c.now.window) : '')
          + '.</div>';
      }
      const done = !c.now.who;
      // A day with no coal load never reads "Complete": the banner above the
      // chain has already said what the day was, and nobody ran it.
      const now = done
        ? (c.no_load ? ''
           : '<div class="now ok"><b>Complete</b> &mdash; ' + esc(c.now.note) + '</div>')
        : '<div class="now"><b>Pending at: ' + esc(c.now.who) + '</b> &mdash; '
          + esc(c.now.note)
          + (c.now.overdue ? ' &middot; <b style="color:var(--bad)">its window ('
              + esc(c.now.window) + ') has passed</b>' : '') + '</div>';
      const noload = c.no_load
        ? '<div class="noload"><b>No coal load on ' + dmy(day.date) + '</b>'
          + esc(c.no_load_note) + '.</div>'
        : '';
      return (c.company ? '<div class="co">' + esc(c.company) + '</div>' : '')
        + noload
        + '<div class="steps' + (c.no_load ? ' noload' : '') + '">'
        + c.stages.map(stepHtml).join('') + '</div>' + now;
    }).join('');
    return '<div class="card' + (dayMissed ? ' missed' : '') + '"><div class="day"><h2>'
      + dmy(day.date) + '</h2>'
      + chips + '</div>' + cos + '</div>';
  }).join('');
}

async function load(){
  try {
    draw(await jget('/api/shift/flow'));
    $('#stamp').textContent = 'read ' + new Date().toTimeString().slice(0, 8);
  } catch (e) {
    $('#body').innerHTML = '<div class="card msg">Could not load.</div>';
  }
}
load();
setInterval(load, 60000);
</script>
</body>
</html>
