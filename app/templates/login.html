{% extends "base.html" %}
{% block body %}
<script>
/* If the session expires while an embedded page (e.g. the GPS Capture tab) is
   open, its iframe gets redirected here. Logging in inside a frame strands the
   user, so break out and log in at the top level, returning to the tool. */
if (window.top !== window.self) {
  try { window.top.location.href = "/login?next=/tool"; } catch (e) {}
}
</script>
<div class="authbox">
  <h1>Please login</h1>
  <!-- No autofill on this form. The control room shares machines, and the
       screens get photographed for training material — a dropdown of previously
       typed usernames puts colleagues' accounts on someone else's screen and
       into screenshots. "new-password" on the password field is what stops the
       browser pairing a saved credential with the username box. -->
  <form method="post" action="{{ url_for('auth.login') }}" autocomplete="off">
    <input name="username" placeholder="Username" autofocus
           autocomplete="off" autocapitalize="none" autocorrect="off"
           spellcheck="false">
    <input name="password" type="password" placeholder="Password"
           autocomplete="new-password">
    <button type="submit">Log in</button>
  </form>
</div>
{% endblock %}
