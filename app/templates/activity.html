<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Activity</title>
<style>
  :root{ --bg:#0b0b0c; --panel:#161618; --panel2:#1f1f22; --line:#2a2a2e; --ink:#e6e6ea; --mut:#8a8f98; --grn:#34c759; --blue:#0a84ff; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,system-ui,Segoe UI,Roboto,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
  header h1{font-size:16px;margin:0}
  header .sp{flex:1}
  a.btn{color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px}
  a.btn:hover{border-color:var(--mut)}
  .wrap{padding:18px;max-width:1050px;margin:0 auto}
  .note{color:var(--mut);font-size:13px;margin:0 0 16px}
  .user{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 14px}
  .uhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .uname{font-weight:600;font-size:16px}
  .total{color:var(--mut);font-size:13px}
  .cols{display:grid;grid-template-columns:1.2fr .8fr;gap:22px}
  @media(max-width:740px){.cols{grid-template-columns:1fr}}
  h3{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin:0 0 8px}
  .bar{display:grid;grid-template-columns:150px 1fr 70px;align-items:center;gap:10px;margin:4px 0;font-size:13px}
  .bar .track{background:var(--panel2);border-radius:5px;height:14px;overflow:hidden}
  .bar .fill{background:var(--blue);height:100%}
  .bar .v{color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
  .ctry{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0;border-bottom:1px solid var(--line)}
  .ctry .n{color:var(--mut)}
  .logins{font-size:12px;color:var(--mut);margin-top:10px}
  .logins div{padding:2px 0}
  .feed{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
  .evlist{max-height:260px;overflow:auto;font-size:12px}
  .evrow{display:grid;grid-template-columns:130px 92px 1fr;gap:8px;padding:3px 0;border-bottom:1px solid var(--line);align-items:baseline}
  .evrow .evt{color:var(--mut);font-variant-numeric:tabular-nums}
  .evrow .eva{color:var(--blue)}
  .evrow .evd{color:var(--ink);word-break:break-word}
  @media(max-width:560px){.evrow{grid-template-columns:1fr;gap:0}}
  .err{color:#ff6b6b}
  /* WhatsApp use, by person (01/10/2026). */
  .wa-sum{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px}
  .wa-sum table{border-collapse:collapse;font-size:13px;width:100%;max-width:640px}
  .wa-sum th{color:var(--mut);font-weight:500;text-align:left;padding:3px 10px 5px 0;border-bottom:1px solid var(--line)}
  .wa-sum td{padding:4px 10px 4px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  .wa-tag{color:var(--blue);font-size:13px}
  /* Pick who to look at, and compare them side by side (27/10/2026). */
  .slicer{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:16px}
  .sl-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .sl-head h3{margin:0}
  .sl-head input[type=search]{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:5px 9px;font-size:13px;width:200px}
  .sl-btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:4px 10px;font-size:12px;cursor:pointer}
  .sl-btn:hover{border-color:var(--mut)}
  .sl-n{color:var(--mut);font-size:12px;margin-left:auto}
  .sl-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2px 14px;max-height:220px;overflow:auto}
  .sl-item{display:flex;align-items:center;gap:7px;font-size:13px;padding:3px 2px;cursor:pointer;border-radius:5px}
  .sl-item:hover{background:var(--panel2)}
  .sl-item input{accent-color:var(--blue);margin:0}
  .sl-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sl-item .t{color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
  .cmp{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:16px;overflow-x:auto}
  .cmp table{border-collapse:collapse;font-size:13px;min-width:100%}
  .cmp th,.cmp td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  .cmp th:first-child,.cmp td:first-child{text-align:left;position:sticky;left:0;background:var(--panel)}
  .cmp thead th{color:var(--ink);font-weight:600;font-size:12px;vertical-align:bottom}
  .cmp tr.sum td{font-weight:600;border-bottom:2px solid var(--line)}
  .cmp td.top{color:var(--grn);font-weight:600}
  .cmp td.zero{color:#4a4d55}
  .cmp .mini{display:block;height:4px;background:var(--blue);border-radius:2px;margin-top:3px;margin-left:auto}
</style>
<script src="/static/datefmt.js?v={{ asset_v('datefmt.js') }}"></script>
</head>
<body>
<header>
  <h1>Activity</h1>
  <div class="sp"></div>
  <a class="btn" href="/admin">Users</a>
  <a class="btn" href="/admin/activity/export.xlsx">Export Excel</a>
  <a class="btn" href="/tool">← Tool</a>
  <a class="btn" href="/logout">Log out</a>
</header>
<div class="wrap">
  <p class="note">Per-user usage: which areas they spend the most time in, total time, and where they log in from (approximate, by IP). Time is aggregated from the tool; country is recorded at login. Login times shown in UTC+7 (Indochina).</p>
  <div id="slicer"></div>
  <div id="cmp"></div>
  <div id="waSum"></div>
  <div id="list">Loading…</div>
</div>

<script>
const LABEL = {
  perf:'Performance', daily:'Daily performance', pva:'Plan vs Actual', subfleet:'Subcontractor fleet status',
  anchors:'Parameter', data:'Sequence/Route', 'data:sequence':'Sequence', 'data:route':'Route', 'data:timeline':'Timeline',
  gps:'GPS Data', plan:'Dispatch Plan', truckstatus:'Truck Status', weigh:'Weighbridge', fleet:'Fleet', guide:'Guide',
  ops:'Operations', send:'Send Plan',
  'ops:subcontractor':'Ops › Subcontractor', 'ops:readiness':'Ops › Supervisor',
  'ops:approvals':'Ops › Managers', 'ops:planner':'Ops › Planner',
  'ops:monitor':'Ops › Monitor', 'ops:map':'Ops › Map', 'ops:flow':'Ops › Process'
};
const lab = p => LABEL[p] || p;
const ACT = {
  open_tab:'Opened', sort:'Sorted', upload:'Uploaded', calculate:'Calculate',
  export:'Exported', manual_time:'Manual time', language:'Language',
  edit:'Edited', delete:'Removed', draw:'Drew', whatsapp:'WhatsApp'
};
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dur(sec){ sec=Math.round(sec||0); if(sec<60) return sec+'s'; const m=Math.round(sec/60); if(m<60) return m+'m'; const h=Math.floor(m/60); return h+'h '+(m%60)+'m'; }
function fmtTs(iso){ if(!iso) return '—'; const d=new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(iso)?iso:iso+'Z'); if(isNaN(d)) return esc(String(iso).replace('T',' ').slice(0,16)); const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d); const g=t=>(p.find(x=>x.type===t)||{}).value||'00'; return g('day')+'/'+g('month')+'/'+g('year')+' '+g('hour')+':'+g('minute'); }
function flag(cc){ if(!cc||cc.length!==2) return ''; return cc.toUpperCase().replace(/./g,c=>String.fromCodePoint(127397+c.charCodeAt(0)))+' '; }

function userBlock(name, u){
  const max = Math.max(1, ...(u.areas.map(a=>a.seconds)));
  const bars = u.areas.map(a =>
    '<div class="bar"><span>'+esc(lab(a.page))+'</span><div class="track"><div class="fill" style="width:'+Math.round(a.seconds/max*100)+'%"></div></div><span class="v">'+dur(a.seconds)+'</span></div>'
  ).join('') || '<div class="note">No usage recorded yet.</div>';
  const ctry = u.countries.map(c =>
    '<div class="ctry"><span>'+flag(c.code)+esc(c.country)+'</span><span class="n">'+c.count+' login'+(c.count>1?'s':'')+'</span></div>'
  ).join('') || '<div class="note">No logins recorded.</div>';
  const logins = u.logins.slice(0,8).map(l =>
    '<div>'+fmtTs(l.ts)+' · '+esc(l.country)+' · '+esc(l.ip)+'</div>'
  ).join('');
  const ev = (u.events||[]).map(e =>
    '<div class="evrow"><span class="evt">'+fmtTs(e.ts)+'</span><span class="eva">'+esc(ACT[e.action]||e.action)+'</span><span class="evd">'+esc(e.detail||'')+'</span></div>'
  ).join('') || '<div class="note">No actions recorded yet.</div>';
  const w = u.whatsapp || {};
  const wa = (w.sends || w.chats)
    ? '<span class="wa-tag">WhatsApp: '+(w.sends||0)+' plan sent · '+(w.chats||0)+' driver chat</span>' : '';
  return '<div class="user"><div class="uhead"><span class="uname">'+esc(name)+'</span><span class="total">total '+dur(u.total_seconds)+'</span>'+wa+'</div>'
    + '<div class="cols"><div><h3>Time by area (most used first)</h3>'+bars+'</div>'
    + '<div><h3>Logged in from</h3>'+ctry+'<div class="logins"><h3>Recent logins</h3>'+(logins||'<div>—</div>')+'</div></div></div>'
    + '<div class="feed"><h3>Recent actions (newest first)</h3><div class="evlist">'+ev+'</div></div></div>';
}

// The selection, remembered in this browser only.
const SEL_KEY = 'activity.selected';
function loadSel(){ try { const v = JSON.parse(localStorage.getItem(SEL_KEY) || 'null'); return Array.isArray(v) ? v : null; } catch (e) { return null; } }
function saveSel(a){ try { localStorage.setItem(SEL_KEY, JSON.stringify(a)); } catch (e) {} }
let DATA = {}, NAMES = [], SEL = new Set(), FIND = '';

function drawSlicer(){
  const shown = NAMES.filter(n => !FIND || n.toLowerCase().indexOf(FIND) >= 0);
  document.getElementById('slicer').innerHTML = '<div class="slicer"><div class="sl-head"><h3>Users</h3>'
    + '<input type="search" id="slFind" placeholder="find a user..." value="' + esc(FIND) + '">'
    + '<button class="sl-btn" data-sl="all">All</button><button class="sl-btn" data-sl="none">None</button>'
    + (FIND ? '<button class="sl-btn" data-sl="only">Only these ' + shown.length + '</button>' : '')
    + '<span class="sl-n">' + SEL.size + ' of ' + NAMES.length + ' selected</span></div>'
    + '<div class="sl-list">' + (shown.map(n => '<label class="sl-item"><input type="checkbox" data-u="' + esc(n) + '"'
        + (SEL.has(n) ? ' checked' : '') + '><span class="nm" title="' + esc(n) + '">' + esc(n) + '</span>'
        + '<span class="t">' + dur(DATA[n].total_seconds) + '</span></label>').join('')
      || '<div class="note">No user matches.</div>') + '</div></div>';
  const f = document.getElementById('slFind');
  f.addEventListener('input', () => {
    FIND = f.value.trim().toLowerCase(); drawSlicer();
    const g = document.getElementById('slFind'); g.focus(); g.setSelectionRange(g.value.length, g.value.length);
  });
  document.querySelectorAll('[data-u]').forEach(cb => cb.addEventListener('change', () => {
    if (cb.checked) SEL.add(cb.dataset.u); else SEL.delete(cb.dataset.u);
    saveSel([...SEL]); drawAll();
  }));
  document.querySelectorAll('[data-sl]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.sl;
    if (k === 'all') SEL = new Set(NAMES);
    if (k === 'none') SEL = new Set();
    if (k === 'only') SEL = new Set(NAMES.filter(n => n.toLowerCase().indexOf(FIND) >= 0));
    saveSel([...SEL]); drawAll();
  }));
}

// Side by side: one column per chosen user, one row per area of the tool.
function drawCompare(sel){
  const el = document.getElementById('cmp');
  if (sel.length < 2) { el.innerHTML = ''; return; }
  const secs = {}, order = {};
  sel.forEach(n => (DATA[n].areas || []).forEach(a => {
    (secs[a.page] = secs[a.page] || {})[n] = a.seconds;
    order[a.page] = (order[a.page] || 0) + a.seconds;
  }));
  const pages = Object.keys(order).sort((a, b) => order[b] - order[a]);
  const cells = (vals, fmt, bar) => {
    const top = Math.max(0, ...vals);
    return vals.map(v => {
      if (!v) return '<td class="zero">—</td>';
      return '<td' + (v === top && vals.filter(x => x).length > 1 ? ' class="top"' : '') + '>' + fmt(v)
        + (bar ? '<span class="mini" style="width:' + Math.max(4, Math.round(v / top * 60)) + 'px"></span>' : '') + '</td>';
    }).join('');
  };
  const row = (label, vals, fmt, bar, cls) => '<tr' + (cls ? ' class="' + cls + '"' : '') + '><td>' + label + '</td>' + cells(vals, fmt, bar) + '</tr>';
  const lastLogin = n => ((DATA[n].logins || [])[0] || {}).ts;
  el.innerHTML = '<div class="cmp"><h3>Compare ' + sel.length + ' users</h3><table><thead><tr><th>Area</th>'
    + sel.map(n => '<th title="' + esc(n) + '">' + esc(n.split('@')[0]) + '</th>').join('') + '</tr></thead><tbody>'
    + row('Total time', sel.map(n => DATA[n].total_seconds || 0), dur, false, 'sum')
    + row('Logins', sel.map(n => (DATA[n].countries || []).reduce((t, c) => t + (c.count || 0), 0)), String, false)
    + '<tr><td>Last login</td>' + sel.map(n => '<td>' + fmtTs(lastLogin(n)) + '</td>').join('') + '</tr>'
    + row('WhatsApp: plans sent', sel.map(n => (DATA[n].whatsapp || {}).sends || 0), String, false)
    + row('WhatsApp: driver chats', sel.map(n => (DATA[n].whatsapp || {}).chats || 0), String, false, 'sum')
    + pages.map(p => row(esc(lab(p)), sel.map(n => (secs[p] || {})[n] || 0), dur, true)).join('')
    + '</tbody></table><div class="note" style="margin:8px 0 0">Green = the most among the users compared. Bars are relative within each row.</div></div>';
}

function drawWa(sel){
  const wu = sel.filter(n => { const w = DATA[n].whatsapp || {}; return w.sends || w.chats; })
    .sort((a, b) => (DATA[b].whatsapp.sends + DATA[b].whatsapp.chats) - (DATA[a].whatsapp.sends + DATA[a].whatsapp.chats));
  document.getElementById('waSum').innerHTML = '<div class="wa-sum"><h3>WhatsApp to drivers — recorded since 01/10/2026</h3>'
    + (wu.length
      ? '<table><thead><tr><th>User</th><th>Plans sent (Send Plan)</th><th>Driver chats (Monitor)</th><th>Last</th></tr></thead><tbody>'
        + wu.map(n => { const w = DATA[n].whatsapp; return '<tr><td>'+esc(n)+'</td><td>'+w.sends+'</td><td>'+w.chats+'</td><td>'+fmtTs(w.last)+'</td></tr>'; }).join('')
        + '</tbody></table>'
      : '<div class="note">None of the selected users has pressed a WhatsApp button since it began to be recorded.</div>')
    + '<div class="note" style="margin-top:8px">A press opens WhatsApp with the message ready. Whether it was then sent is not something this system can see.</div></div>';
}

function drawAll(){
  drawSlicer();
  const sel = NAMES.filter(n => SEL.has(n));
  drawCompare(sel);
  drawWa(sel);
  document.getElementById('list').innerHTML = sel.length ? sel.map(n => userBlock(n, DATA[n])).join('')
    : '<p class="note">No user selected - tick one or more above.</p>';
}

fetch('/api/admin/activity').then(r=>{
  if(r.status===403){ document.getElementById('list').innerHTML='<p class="err">Admins only.</p>'; return null; }
  return r.json();
}).then(data=>{
  if(!data) return;
  const names = Object.keys(data).sort((a,b)=>data[b].total_seconds-data[a].total_seconds);
  DATA = data; NAMES = names;
  const kept = loadSel();
  SEL = new Set(kept ? kept.filter(n => data[n]) : names);
  if (!names.length) { document.getElementById('list').innerHTML = '<p class="note">No activity yet.</p>'; return; }
  drawAll();
  return;
  // Who uses the WhatsApp buttons - the question the feed below cannot answer,
  // because it stops at each person's last sixty actions. Counted since
  // 01/10/2026, when a press began to be recorded.
  const wu = Object.keys(data).filter(n => { const w = data[n].whatsapp || {}; return w.sends || w.chats; })
    .sort((a, b) => (data[b].whatsapp.sends + data[b].whatsapp.chats) - (data[a].whatsapp.sends + data[a].whatsapp.chats));
  document.getElementById('waSum').innerHTML = '<div class="wa-sum"><h3>WhatsApp to drivers — recorded since 01/10/2026</h3>'
    + (wu.length
      ? '<table><thead><tr><th>User</th><th>Plans sent (Send Plan)</th><th>Driver chats (Monitor)</th><th>Last</th></tr></thead><tbody>'
        + wu.map(n => { const w = data[n].whatsapp; return '<tr><td>'+esc(n)+'</td><td>'+w.sends+'</td><td>'+w.chats+'</td><td>'+fmtTs(w.last)+'</td></tr>'; }).join('')
        + '</tbody></table>'
      : '<div class="note">Nobody has pressed a WhatsApp button since it began to be recorded.</div>')
    + '<div class="note" style="margin-top:8px">A press opens WhatsApp with the message ready. Whether it was then sent is not something this system can see.</div></div>';
  const el = document.getElementById('list');
  el.innerHTML = names.length ? names.map(n=>userBlock(n,data[n])).join('') : '<p class="note">No activity yet.</p>';
}).catch(()=>{ document.getElementById('list').innerHTML='<p class="err">Could not load activity.</p>'; });
</script>
</body>
</html>
